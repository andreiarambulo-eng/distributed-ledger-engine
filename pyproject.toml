[project]
name = "backend-template"
version = "0.1.0"
description = "FastAPI backend template with Clean Architecture, Dishka DI, PostgreSQL, and Redis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "dishka>=1.4.0",
    "psycopg[binary,pool]>=3.2.0",
    "redis>=5.2.0",
    "motor>=3.6.0",
    "elasticsearch[async]>=8.15.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

pythonpath = ["src"]